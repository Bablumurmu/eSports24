<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>eSports24 Admin</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<header class="topbar">

  <a
    class="brand"
    href="index.html"
  >
    eSports24 Admin
  </a>

  <button
    id="adminLogout"
    class="btn small"
  >
    Logout
  </button>

</header>


<main class="container admin">


  <!-- =========================
       ADMIN LOGIN
  ========================= -->

  <section
    id="adminLoginCard"
    class="card"
  >

    <h1>Admin Login</h1>


    <form id="adminLoginForm">

      <input
        id="adminEmail"
        type="email"
        placeholder="Admin email"
        required
      >


      <input
        id="adminPassword"
        type="password"
        placeholder="Password"
        required
      >


      <button
        class="btn primary"
      >
        Login
      </button>

    </form>

  </section>



  <!-- =========================
       ADMIN DASHBOARD
  ========================= -->

  <section
    id="dashboard"
    hidden
  >


    <div class="grid2">


      <!-- =========================
           BRAND & PAYMENT
      ========================= -->

      <section class="card">

        <h2>
          Brand & Payment
        </h2>


        <form
          id="settingsForm"
        >

          <input
            id="logoUrl"
            placeholder="Logo image URL"
          >


          <input
            id="splashUrl"
            placeholder="Splash image URL"
          >


          <input
            id="qrUrl"
            placeholder="Payment QR image URL"
          >


          <button
            class="btn primary"
          >
            Save settings
          </button>

        </form>


        <p class="muted">

          No Firebase Storage is used.
          Enter direct HTTPS image URLs;
          they are stored in Firestore at
          adminSettings/public.

        </p>

      </section>



      <!-- =========================
           CREATE TOURNAMENT
      ========================= -->

      <section class="card">

        <h2>
          Create Tournament
        </h2>


        <form
          id="tournamentForm"
        >


          <!-- TOURNAMENT NAME -->

          <input
            id="tName"
            placeholder="Tournament name"
            required
          >


          <!-- TOURNAMENT IMAGE -->

          <input
            id="tImage"
            placeholder="Tournament image URL"
            required
          >


          <!-- MODE -->

          <select id="tMode">

            <option>
              Solo
            </option>

            <option>
              Duo
            </option>

            <option>
              Squad
            </option>

          </select>


          <!-- FREE / PAID -->

          <select id="tFree">

            <option value="false">
              Paid
            </option>

            <option value="true">
              Free
            </option>

          </select>



          <!-- =========================
               ENTRY FEE
          ========================= -->

          <div class="form-box">

            <label for="tFee">
              Entry Fee
            </label>


            <input
              id="tFee"
              type="number"
              min="0"
              step="1"
              value="0"
              placeholder="₹ Entry Fee"
            >

          </div>



          <!-- =========================
               PER KILL
          ========================= -->

          <div class="form-box">

            <label for="tKill">
              Per Kill
            </label>


            <input
              id="tKill"
              type="number"
              min="0"
              step="0.01"
              value="0"
              placeholder="₹ Per Kill"
            >

          </div>



          <!-- =========================
               TOTAL SLOTS
          ========================= -->

          <div class="form-box">

            <label for="tSlots">
              Total Slots
            </label>


            <input
              id="tSlots"
              type="number"
              min="1"
              placeholder="Total slots"
              required
            >

          </div>



          <!-- =========================
               REGISTRATION END
          ========================= -->

          <div class="form-box">

            <label for="tReg">
              Registration ends
            </label>


            <input
              id="tReg"
              type="datetime-local"
              required
            >

          </div>



          <!-- =========================
               MATCH DATE
          ========================= -->

          <div class="form-box">

            <label for="tDate">
              Match date/time
            </label>


            <input
              id="tDate"
              type="datetime-local"
              required
            >

          </div>



          <!-- =========================
               PRIZE DISTRIBUTION
          ========================= -->

          <div class="form-box">

            <label>
              Prize Distribution
            </label>


            <!-- 1ST -->

            <input
              id="prize1"
              type="number"
              min="0"
              step="1"
              value="0"
              placeholder="🥇 1st Prize ₹"
            >


            <!-- 2ND -->

            <input
              id="prize2"
              type="number"
              min="0"
              step="1"
              value="0"
              placeholder="🥈 2nd Prize ₹"
            >


            <!-- 3RD -->

            <input
              id="prize3"
              type="number"
              min="0"
              step="1"
              value="0"
              placeholder="🥉 3rd Prize ₹"
            >



            <!-- =========================
                 RANGE 1
            ========================= -->

            <div class="prize-range">

              <input
                id="prizeRange1"
                type="text"
                placeholder="4th to 7th"
              >


              <input
                id="prizeAmount1"
                type="number"
                min="0"
                step="1"
                value="0"
                placeholder="Prize ₹"
              >

            </div>



            <!-- =========================
                 RANGE 2
            ========================= -->

            <div class="prize-range">

              <input
                id="prizeRange2"
                type="text"
                placeholder="8th to 10th"
              >


              <input
                id="prizeAmount2"
                type="number"
                min="0"
                step="1"
                value="0"
                placeholder="Prize ₹"
              >

            </div>



            <!-- =========================
                 RANGE 3
            ========================= -->

            <div class="prize-range">

              <input
                id="prizeRange3"
                type="text"
                placeholder="11th to 15th"
              >


              <input
                id="prizeAmount3"
                type="number"
                min="0"
                step="1"
                value="0"
                placeholder="Prize ₹"
              >

            </div>



            <!-- =========================
                 RANGE 4
            ========================= -->

            <div class="prize-range">

              <input
                id="prizeRange4"
                type="text"
                placeholder="16th to 20th"
              >


              <input
                id="prizeAmount4"
                type="number"
                min="0"
                step="1"
                value="0"
                placeholder="Prize ₹"
              >

            </div>



            <!-- =========================
                 RANGE 5
            ========================= -->

            <div class="prize-range">

              <input
                id="prizeRange5"
                type="text"
                placeholder="21st to 25th"
              >


              <input
                id="prizeAmount5"
                type="number"
                min="0"
                step="1"
                value="0"
                placeholder="Prize ₹"
              >

            </div>

          </div>



          <!-- =========================
               CREATE
          ========================= -->

          <button
            class="btn primary"
            type="submit"
          >
            Create tournament
          </button>


        </form>

      </section>

    </div>



    <!-- =========================
         DEPOSIT REQUESTS
    ========================= -->

    <section class="card">

      <h2>
        Deposit Requests
      </h2>

      <div id="deposits"></div>

    </section>



    <!-- =========================
         TOURNAMENTS
    ========================= -->

    <section class="card">

      <h2>
        Tournaments
      </h2>

      <div
        id="adminTournaments"
      ></div>

    </section>



    <!-- =========================
         ROOM
    ========================= -->

    <section class="card">

      <h2>
        Room ID / Password
      </h2>


      <form id="roomForm">


        <input
          id="roomTournamentId"
          placeholder="Tournament ID"
          required
        >


        <input
          id="roomId"
          placeholder="Room ID"
          required
        >


        <input
          id="roomPassword"
          placeholder="Room password"
          required
        >


        <button
          class="btn primary"
        >
          Update room
        </button>


      </form>

    </section>



    <!-- =========================
         PLAYERS
    ========================= -->

    <section class="card">

      <h2>
        Joined Players
      </h2>


      <div id="players"></div>

    </section>


  </section>

</main>



<!-- TOAST -->

<div
  id="toast"
  class="toast"
></div>



<script
  type="module"
  src="admin.js"
></script>


</body>

</html>
